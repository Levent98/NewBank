name: Feature Branch CI

on:
  push:
    # Trigger the workflow only when pushing to this specific feature branch
    branches:
      - 'feature/distributed-banking-architecture'

jobs:
  build-and-test:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the source code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Java 17 environment
      # Using 'temurin' distribution and enabling Maven caching for faster builds
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile the code and execute JUnit tests
      # 'clean' ensures a fresh build, 'test' runs all unit tests
      - name: Build and Run Tests
        run: mvn clean test